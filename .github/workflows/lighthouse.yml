name: Lighthouse
on: push

jobs:
  bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies without legacy native postinstall scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify copy-text-to-clipboard bundles with Rollup
        run: node .github/ci/verify-copy-text-bundle.cjs

  static-dist-dir:
    needs: bundle-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Lighthouse against a static dist dir
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.github/workflows/lighthouserc.json'
          temporaryPublicStorage: true
          runs: 1
